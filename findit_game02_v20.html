<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Find It! 숨은그림찾기</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* ===== WRAPPER: 16:9 aspect ratio, centered ===== */
html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  background: #fff;
  font-family: 'Nunito', 'Noto Sans KR', sans-serif;
  overflow: hidden;
}

/* 
  핵심: #app-shell을 화면 전체(100vw x 100vh)로 고정
  #inner가 가로 비율로 꽉 채움
  JS 없이 CSS만 사용 → iOS 인앱브라우저 호환
*/
#app-shell {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  background: #fff;
}

#aspect-box {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background: #fff;
  overflow: hidden;
}

#inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
}

/* ===== HEADER BANNER ===== */
#top-header {
  position: relative;
  background: #E8314A;
  height: 12%;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  z-index: 10;
}

/* Red banner wave bottom */
#top-header::after {
  content: '';
  position: absolute;
  bottom: -16px;
  left: 0; right: 0;
  height: 18px;
  background: #E8314A;
  clip-path: ellipse(52% 100% at 50% 0%);
}

.header-nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  border: none;
  color: #fff;
  font-size: 22px;
  font-weight: 900;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .2s;
}
#btn-prev { left: 10px; }
#btn-next-top { right: 10px; }
.header-nav-btn:hover { background: rgba(255,255,255,.4); }
.header-nav-btn:disabled { opacity: .3; cursor: default; }

.header-title {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #fff;
  font-size: clamp(18px, 3vw, 36px);
  font-weight: 900;
  text-shadow: 0 2px 8px rgba(0,0,0,.25);
  letter-spacing: .3px;
}

.header-slide-badge {
  position: absolute;
  right: 58px;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,255,255,.22);
  color: #fff;
  font-size: clamp(10px, 1.2vw, 14px);
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 20px;
  letter-spacing: .5px;
}

/* reset-inline-btn 스타일 */
#reset-inline-btn {
  background: rgba(255,255,255,0.9);
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  padding: 6px 4px;
  width: 100%;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  flex-shrink: 0;
  transition: all .2s;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
  color: #555;
}
#reset-inline-btn .btn-icon {
  font-size: clamp(16px, 2.2vw, 26px);
  line-height: 1;
}
#reset-inline-btn .btn-text {
  font-size: clamp(8px, 1vw, 12px);
  font-weight: 800;
  white-space: nowrap;
}
#reset-inline-btn:hover { background: #22C55E; border-color: #22C55E; color: #fff; }

/* ===== CONTENT AREA ===== */
#content-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  padding: 10px 14px 10px 14px;
  display: flex;
  flex-direction: column;
}

/* ===== SLIDE SYSTEM ===== */
.slide { display: none; height: 100%; }
.slide.active { display: flex; flex-direction: column; height: 100%; }

/* ===== GAME SLIDE ===== */
#gc {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  height: 100%;
  gap: 10px;
}

/* 왼쪽 사이드바 (별 + 다시하기) */
#left-sidebar {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-shrink: 0;
  width: clamp(44px, 6vw, 70px);
}

#progress {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
}

.star {
  font-size: clamp(18px, 2.8vw, 34px);
  transition: all .3s;
  filter: grayscale(1) opacity(.35);
}
.star.lit { filter: none; animation: pop .4s cubic-bezier(.36,1.5,.6,1); }
@keyframes pop { 0%{transform:scale(0)} 60%{transform:scale(1.3)} 100%{transform:scale(1)} }

#sw {
  position: relative;
  flex: 1;
  min-width: 0;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,.15);
  cursor: crosshair;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  min-height: 0;
  background: #fff;
}

#si {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  object-position: center;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-user-drag: none;
}

/* ===== CLICK ZONES & OVERLAYS ===== */
.cz {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;   /* 터치/클릭을 #sw가 직접 처리 */
  transition: background .15s;
}

.fc {
  position: absolute;
  border-radius: 50%;
  border: 4px solid #22C55E;
  background: rgba(34,197,94,.2);
  pointer-events: none;
  animation: ring .4s cubic-bezier(.36,1.5,.6,1) forwards;
}
@keyframes ring { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }

.sp {
  position: absolute;
  pointer-events: none;
  animation: spout .8s ease forwards;
  font-size: 22px;
  transform-origin: center;
}
@keyframes spout { 0%{transform:scale(1.2) translateY(0);opacity:1} 100%{transform:scale(0) translateY(-50px);opacity:0} }

/* ===== COMPLETION BANNER ===== */
#complete-banner {
  visibility: hidden;
  pointer-events: none;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%) scale(0.6);
  background: linear-gradient(135deg,#FFD700,#FF8C00);
  border-radius: 22px;
  padding: 28px 36px;
  text-align: center;
  box-shadow: 0 10px 36px rgba(0,0,0,.35);
  z-index: 10;
  width: 72%;
  max-width: 320px;
  opacity: 0;
  transition: transform .4s cubic-bezier(.36,1.5,.6,1), opacity .35s ease;
}
#complete-banner.show {
  visibility: visible;
  pointer-events: auto;
  opacity: 1;
  transform: translate(-50%,-50%) scale(1);
}
#complete-banner h2 { font-size: clamp(18px,2.5vw,26px); color:#fff; font-weight:900; text-shadow:1px 2px 0 rgba(0,0,0,.2); margin-bottom:6px; }
#complete-banner p { color:#fff; font-size: clamp(12px,1.4vw,15px); font-weight:700; margin-bottom:14px; }
.banner-btn {
  background:white; color:#F97316; border:none; border-radius:30px;
  padding: 8px 18px; font-size: clamp(12px,1.3vw,15px); font-weight:900;
  cursor:pointer; font-family:inherit; box-shadow:0 2px 8px rgba(0,0,0,.15);
  margin:4px; transition:transform .15s;
}
.banner-btn:hover { transform:scale(1.06); }
.banner-btn.next { background:#22C55E; color:white; }



/* ===== PLACEHOLDER SLIDE ===== */
.slide-placeholder {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  background:#f9f9f9;
  border-radius:14px;
  text-align:center;
  padding: 40px;
}
</style>
</head>

<div id="app-shell">
  <div id="aspect-box">
    <div id="inner">

      <!-- ===== TOP HEADER ===== -->
      <div id="top-header">
        <button class="header-nav-btn" onclick="changeSlide(-1)" id="btn-prev" disabled>&#8592;</button>
        <div class="header-title">
          <span>🔍</span>
          <span id="slide-title">Find It!</span>

        <span class="header-slide-badge" id="slide-label">1 / 2</span>
        <button class="header-nav-btn" onclick="changeSlide(1)" id="btn-next-top">&#8594;</button>

      <!-- ===== CONTENT ===== -->
      <div id="content-area">

<script>
// ===== 슬라이드 표제 설정 (각 슬라이드마다 제목을 여기서 수정) =====
const SLIDE_TITLES = [
  'Find It! — Scene 1',
  'Find It! — Scene 2'
];


const T = [
  { id:'nest',    label:'🪹 nest!',    cx:.918, cy:.093, r:.035 },
  { id:'bicycle', label:'🚲 bicycle!', cx:.915, cy:.89, r:.073 },
  { id:'mailbox', label:'📬 mailbox!', cx:.95, cy:.75, r:.05 }
];

const HINTS = {
  nest:    'nest 찾았어요! 🪹',
  bicycle: 'bicycle 찾았어요! 🚲',
  mailbox: 'mailbox 찾았어요! 📬'
};

let found = {}, zones = [], overlays = [];

// Google TTS 원어민 발음
function speakWord(word) {
  const url = 'https://translate.google.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=' + encodeURIComponent(word);
  const audio = new Audio(url);
  audio.play().catch(() => {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(word);
    utter.lang = 'en-US';
    utter.rate = 0.85;
    window.speechSynthesis.speak(utter);
  });
}

function dims() {
  const si = document.getElementById('si');
  const sw = document.getElementById('sw');
  const natW = si.naturalWidth || 1;
  const natH = si.naturalHeight || 1;
  const boxW = sw.offsetWidth;
  const boxH = sw.offsetHeight;
  // letterbox: compute rendered image rect inside sw
  const scaleW = boxW / natW;
  const scaleH = boxH / natH;
  const scale = Math.min(scaleW, scaleH);
  const rW = natW * scale;
  const rH = natH * scale;
  const offX = (boxW - rW) / 2;
  const offY = (boxH - rH) / 2;
  return { w: rW, h: rH, offX, offY };
}

function makeZones() {
  zones.forEach(z => z.remove()); zones = [];
  overlays.forEach(o => o.remove()); overlays = [];
  const sw = document.getElementById('sw');
  const { w, h, offX, offY } = dims();
  T.forEach(t => {
    const el = document.createElement('div');
    el.className = 'cz';
    const px = offX + t.cx * w, py = offY + t.cy * h, rp = t.r * w;
    el.style.cssText = `left:${px-rp}px;top:${py-rp}px;width:${rp*2}px;height:${rp*2}px;`;
    sw.appendChild(el); zones.push(el);
    if (found[t.id]) drawFound(t, w, h, sw, offX, offY);
  });
}

function drawFound(t, w, h, sw, offX=0, offY=0) {
  const px = offX + t.cx * w, py = offY + t.cy * h, rp = t.r * w;
  const c = document.createElement('div'); c.className = 'fc';
  c.style.cssText = `left:${px-rp}px;top:${py-rp}px;width:${rp*2}px;height:${rp*2}px;`;
  sw.appendChild(c); overlays.push(c);
}

function handleFind(t) {
  if (found[t.id]) return;
  found[t.id] = true;

  // TTS: 단어 읽어주기
  speakWord(t.id);

  // 순차적으로 별 점등 (찾은 개수 기준)
  const foundCount = Object.keys(found).length; // 이미 true 처리된 후
  const starIds = ['star-nest', 'star-bicycle', 'star-mailbox'];
  if (foundCount <= starIds.length) {
    document.getElementById(starIds[foundCount - 1]).classList.add('lit');
  }

  const sw = document.getElementById('sw');
  const { w, h, offX, offY } = dims();
  drawFound(t, w, h, sw, offX, offY);

  ['✨','⭐','🌟'].forEach((em, i) => {
    const sp = document.createElement('div'); sp.className = 'sp'; sp.textContent = em;
    const ox = (i - 1) * 30;
    sp.style.cssText = `left:${offX + t.cx*w + ox}px;top:${offY + t.cy*h - 15}px;animation-delay:${i*0.09}s;`;
    sw.appendChild(sp); overlays.push(sp);
    setTimeout(() => sp.remove(), 1000);
  });

  makeZones();
  if (Object.keys(found).length === T.length) {
    setTimeout(() => { document.getElementById('complete-banner').classList.add('show'); }, 700);
  }
}

function resetGame() {
  found = {};
  document.getElementById('complete-banner').classList.remove('show');
  T.forEach(t => document.getElementById('star-' + t.id).classList.remove('lit'));
  makeZones();
}

const si = document.getElementById('si');
si.onload = () => makeZones();
if (si.complete && si.naturalWidth > 0) makeZones();
window.addEventListener('resize', makeZones);
window.addEventListener('orientationchange', function(){ setTimeout(makeZones, 200); });

// ── 터치/클릭 통합 핸들러 ──
// el의 페이지 기준 절대 위치를 offset 누적으로 구함 (getBoundingClientRect 대신)
function getElPageOffset(el) {
  var x = 0, y = 0;
  while (el) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
  return { x: x, y: y };
}

function getRawXY(e) {
  if (e.changedTouches && e.changedTouches.length > 0) {
    return { cx: e.changedTouches[0].pageX, cy: e.changedTouches[0].pageY };
  }
  if (e.touches && e.touches.length > 0) {
    return { cx: e.touches[0].pageX, cy: e.touches[0].pageY };
  }
  return { cx: e.pageX, cy: e.pageY };
}

var _isTouching = false;

function swTouchStart(e) {
  // 완료 배너 떠있으면 버튼 터치를 방해하지 않음
  if (document.getElementById('complete-banner').classList.contains('show')) return;
  _isTouching = true;
  e.preventDefault();
  doHitTest(e);
}
function swClick(e) {
  if (document.getElementById('complete-banner').classList.contains('show')) return;
  if (_isTouching) { _isTouching = false; return; }
  doHitTest(e);
}

function doHitTest(e) {
  const sw = document.getElementById('sw');
  const off = getElPageOffset(sw);
  const raw = getRawXY(e);
  const x = raw.cx - off.x;
  const y = raw.cy - off.y;
  const { w, h, offX, offY } = dims();

  for (const t of T) {
    if (!found[t.id]) continue;
    const px = offX + t.cx * w, py = offY + t.cy * h, rp = t.r * w;
    if ((x - px) ** 2 + (y - py) ** 2 <= rp * rp) { speakWord(t.id); return; }
  }
  for (const t of T) {
    if (found[t.id]) continue;
    const px = offX + t.cx * w, py = offY + t.cy * h, rp = t.r * w;
    if ((x - px) ** 2 + (y - py) ** 2 <= rp * rp) { handleFind(t); return; }
  }
}

const swEl = document.getElementById('sw');
swEl.addEventListener('touchstart', swTouchStart, { passive: false });
swEl.addEventListener('click',      swClick,      false);

// ===== SLIDE NAVIGATION =====
let currentSlide = 1;
const totalSlides = 2;

function changeSlide(dir) {
  const next = currentSlide + dir;
  if (next < 1 || next > totalSlides) return;
  document.getElementById('slide-' + currentSlide).classList.remove('active');
  document.getElementById('complete-banner').classList.remove('show');
  currentSlide = next;
  document.getElementById('slide-' + currentSlide).classList.add('active');
  syncNavButtons();

}

function goNextSlide() {
  document.getElementById('complete-banner').classList.remove('show');
  changeSlide(1);
}


// ===== 슬라이드 네비게이션 재정의 (헤더 버튼 연동) =====
const _origChangeSlide = changeSlide;
// 헤더 prev 버튼은 id="btn-prev", 사이드 next 버튼은 id="btn-next-side"
function syncNavButtons() {
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next-top');
  if (btnPrev) btnPrev.disabled = (currentSlide === 1);
  if (btnNext) btnNext.disabled = (currentSlide === totalSlides);
  // 표제 업데이트
  const titleEl = document.getElementById('slide-title');
  if (titleEl && SLIDE_TITLES[currentSlide-1]) titleEl.textContent = SLIDE_TITLES[currentSlide-1];
  document.getElementById('slide-label').textContent = currentSlide + ' / ' + totalSlides;
}
syncNavButtons();
</script>
